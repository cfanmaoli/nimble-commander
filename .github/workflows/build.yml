name: Build and Test

on:
  # The fork is developed locally and CI is deliberately not wired to every commit: a workflow that
  # fires on each push only burns the shared macOS runner pool. Run it manually when needed, or let
  # the nightly do it.
  schedule:
    # Nightly, 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run every configuration, the full clang-tidy and the integration tests'
        type: boolean
        default: false

permissions:
  contents: read

# A newer run on the same branch supersedes whatever is still running - the macOS runner pool is
# limited, and stale runs only make everyone wait longer.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XC_VERSION: '27.2'
  LLVM_VERSION: '23'

jobs:

  unit-tests:
    # Manual dispatch: Debug only. Nightly / full dispatch: every configuration.
    # The Debug job also runs clang-format and clang-tidy, so there is no separate lint job that
    # every other job would have to wait for.
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(((github.event_name == 'schedule') || inputs.full) && '["Debug","Release","ASAN","UBSAN"]' || '["Debug"]') }}
    steps:
    - name: Select the Xcode version
      run: |
        if [ -d "/Applications/Xcode_${XC_VERSION}.app" ]; then
          sudo xcode-select -s "/Applications/Xcode_${XC_VERSION}.app"
        fi
        xcodebuild -version
    - uses: actions/checkout@v5
    - name: Install the test dependencies
      run: command -v xcpretty >/dev/null 2>&1 || gem install xcpretty
    - name: Cache the Homebrew downloads
      if: matrix.configuration == 'Debug'
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-llvm${{ env.LLVM_VERSION }}-${{ hashFiles('.github/workflows/build.yml') }}
    - name: Install LLVM
      if: matrix.configuration == 'Debug'
      run: brew install llvm@${{ env.LLVM_VERSION }}
    - name: Run clang-format
      if: matrix.configuration == 'Debug'
      run: |
        export PATH="$(brew --prefix)/opt/llvm@${{ env.LLVM_VERSION }}/bin:$PATH"
        cd Scripts && ./run_clang_format.sh --check
    - name: Build and run the unit tests
      env:
        # Build the whole project and keep the compilation database when clang-tidy is about to
        # reuse it - that saves a complete second build of everything.
        EMIT_COMPILE_DB: ${{ matrix.configuration == 'Debug' && '1' || '' }}
      run: "cd Scripts && ./run_all_unit_tests.sh ${{ matrix.configuration }}"
    - name: Run clang-tidy
      if: matrix.configuration == 'Debug'
      run: |
        export PATH="$(brew --prefix)/opt/llvm@${{ env.LLVM_VERSION }}/bin:$PATH"
        cd Scripts
        ./run_clang_tidy.sh --check --use-db run_all_unit_tests.tmp
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: unit-tests-logs-${{ matrix.configuration }}
        path: Scripts/**/*.log
        if-no-files-found: ignore

  integration-tests:
    # The docker/colima setup is the most fragile part of the pipeline, so it only runs nightly or
    # on an explicit full dispatch.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    needs: unit-tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
    - name: Select the Xcode version
      run: |
        if [ -d "/Applications/Xcode_${XC_VERSION}.app" ]; then
          sudo xcode-select -s "/Applications/Xcode_${XC_VERSION}.app"
        fi
        xcodebuild -version
    - name: Install the dependencies
      run: |
        find /usr/local/bin -lname '*/Library/Frameworks/Python.framework/*' -delete
        sudo rm -rf /Library/Frameworks/Python.framework/
        brew install qemu
        brew install docker
        brew install colima
        LIMACTL_PATH=$(brew --prefix)/bin/limactl
        sudo curl -L -o $LIMACTL_PATH https://github.com/mikekazakov/qemu-test/raw/main/limactl && sudo chmod +x $LIMACTL_PATH
        colima start --network-address --arch arm64 --vm-type=qemu
    - uses: actions/checkout@v5
    - name: Work around GHA issue 7522
      run: |
         # TODO: Replace this with a better solution. See https://github.com/actions/runner-images/issues/7522
         echo Killing XProtect...; sudo pkill -9 XProtect >/dev/null || true;
         echo Waiting for XProtect process...; while pgrep XProtect; do sleep 3; done;
    - name: Install the test dependencies
      run: command -v xcpretty >/dev/null 2>&1 || gem install xcpretty
    - name: Build and run integration tests
      run: cd Scripts && ./run_all_integration_tests.sh

  build-unsigned:
    # Every remaining run is deliberate, so produce the unsigned DMG in all of them.
    needs: unit-tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
    - name: Select the Xcode version
      run: |
        if [ -d "/Applications/Xcode_${XC_VERSION}.app" ]; then
          sudo xcode-select -s "/Applications/Xcode_${XC_VERSION}.app"
        fi
        xcodebuild -version
    - name: Cache the Homebrew downloads
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-packaging-${{ hashFiles('.github/workflows/build.yml') }}
    - name: Install the dependencies
      run: brew install create-dmg pandoc basictex
    - uses: actions/checkout@v5
    - name: Install the test dependencies
      # 'gem install' has to happen before path_helper reshuffles the PATH - afterwards it resolves
      # to the un-writable system ruby.
      run: command -v xcpretty >/dev/null 2>&1 || gem install xcpretty
    - name: Build and package
      run: |
        eval "$(/usr/libexec/path_helper)"
        cd Scripts && ./build_unsigned.sh
    - uses: actions/upload-artifact@v6
      with:
        name: nimble-commander-fork-unsigned
        path: Scripts/*.dmg
        if-no-files-found: error
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: build-logs
        path: Scripts/**/*.log
        if-no-files-found: ignore
