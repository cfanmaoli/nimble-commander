name: Build and Test

on:
  # The fork is developed locally and CI is deliberately not wired to every commit: a workflow that
  # fires on each push only burns the shared macOS runner pool. Run it manually when needed, or let
  # the nightly do it.
  schedule:
    # Nightly, 18:17 UTC. The minute is deliberately not :00 - GitHub's scheduler is heavily
    # congested at the top of the hour, and in practice these runs used to start hours late.
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run every configuration, the full clang-tidy and the integration tests'
        type: boolean
        default: false
      publish_nightly:
        description: 'Publish the built DMG as the rolling nightly pre-release'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # the preflight job looks at the previous runs of this workflow

# A newer run on the same branch supersedes whatever is still running - the macOS runner pool is
# limited, and stale runs only make everyone wait longer.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XC_VERSION: '27.2'
  LLVM_VERSION: '23'

jobs:

  preflight:
    # A scheduled run that would build the very same commit as the last successful nightly has
    # nothing to add - skip the whole thing instead of burning an hour of the shared macOS runner
    # pool. Manual dispatches always run: they are deliberate.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
    - name: Skip when nothing was pushed since the last successful nightly
      id: check
      uses: actions/github-script@v7
      with:
        script: |
          if (context.eventName !== 'schedule') {
            core.info('Not a scheduled run - nothing to skip.');
            core.setOutput('proceed', 'true');
            return;
          }
          const runs = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'build.yml',
            event: 'schedule',
            status: 'success',
            per_page: 10,
          });
          const previous = runs.data.workflow_runs.find(run => run.id !== context.runId);
          if (!previous) {
            core.info('No previous successful nightly - running.');
            core.setOutput('proceed', 'true');
            return;
          }
          core.info(`Previous successful nightly: ${previous.head_sha} (${previous.created_at})`);
          core.info(`Current head:                   ${context.sha}`);
          const same = previous.head_sha === context.sha;
          if (same) {
            core.info('Nothing was pushed since the last successful nightly - skipping.');
          } else {
            core.info('The head has changed since the last successful nightly - running.');
          }
          core.setOutput('proceed', same ? 'false' : 'true');

  unit-tests:
    # Manual dispatch: Debug only. Nightly / full dispatch: every configuration.
    # The Debug job also runs clang-format and clang-tidy, so there is no separate lint job that
    # every other job would have to wait for.
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(((github.event_name == 'schedule') || inputs.full) && '["Debug","Release","ASAN","UBSAN"]' || '["Debug"]') }}
    steps:
    - name: Select the Xcode version
      run: |
        if [ -d "/Applications/Xcode_${XC_VERSION}.app" ]; then
          sudo xcode-select -s "/Applications/Xcode_${XC_VERSION}.app"
        fi
        xcodebuild -version
    - uses: actions/checkout@v5
    - name: Install the test dependencies
      run: command -v xcpretty >/dev/null 2>&1 || gem install xcpretty
    - name: Cache the Homebrew downloads
      if: matrix.configuration == 'Debug'
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-llvm${{ env.LLVM_VERSION }}-${{ hashFiles('.github/workflows/build.yml') }}
    - name: Install LLVM
      if: matrix.configuration == 'Debug'
      run: brew install llvm@${{ env.LLVM_VERSION }}
    - name: Run clang-format
      if: matrix.configuration == 'Debug'
      run: |
        export PATH="$(brew --prefix)/opt/llvm@${{ env.LLVM_VERSION }}/bin:$PATH"
        cd Scripts && ./run_clang_format.sh --check
    - name: Build and run the unit tests
      env:
        # Build the whole project and keep the compilation database when clang-tidy is about to
        # reuse it - that saves a complete second build of everything.
        EMIT_COMPILE_DB: ${{ matrix.configuration == 'Debug' && '1' || '' }}
      run: "cd Scripts && ./run_all_unit_tests.sh ${{ matrix.configuration }}"
    - name: Run clang-tidy
      if: matrix.configuration == 'Debug'
      run: |
        export PATH="$(brew --prefix)/opt/llvm@${{ env.LLVM_VERSION }}/bin:$PATH"
        cd Scripts
        ./run_clang_tidy.sh --check --use-db run_all_unit_tests.tmp
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: unit-tests-logs-${{ matrix.configuration }}
        path: Scripts/**/*.log
        if-no-files-found: ignore

  integration-tests:
    # The docker/colima setup is the most fragile part of the pipeline, so it only runs nightly or
    # on an explicit full dispatch.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    needs: unit-tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
    - name: Select the Xcode version
      run: |
        if [ -d "/Applications/Xcode_${XC_VERSION}.app" ]; then
          sudo xcode-select -s "/Applications/Xcode_${XC_VERSION}.app"
        fi
        xcodebuild -version
    - name: Install the dependencies
      run: |
        find /usr/local/bin -lname '*/Library/Frameworks/Python.framework/*' -delete
        sudo rm -rf /Library/Frameworks/Python.framework/
        brew install qemu
        brew install docker
        brew install colima
        LIMACTL_PATH=$(brew --prefix)/bin/limactl
        sudo curl -L -o $LIMACTL_PATH https://github.com/mikekazakov/qemu-test/raw/main/limactl && sudo chmod +x $LIMACTL_PATH
        colima start --network-address --arch arm64 --vm-type=qemu
    - uses: actions/checkout@v5
    - name: Work around GHA issue 7522
      run: |
         # TODO: Replace this with a better solution. See https://github.com/actions/runner-images/issues/7522
         echo Killing XProtect...; sudo pkill -9 XProtect >/dev/null || true;
         echo Waiting for XProtect process...; while pgrep XProtect; do sleep 3; done;
    - name: Install the test dependencies
      run: command -v xcpretty >/dev/null 2>&1 || gem install xcpretty
    - name: Build and run integration tests
      run: cd Scripts && ./run_all_integration_tests.sh

  publish-nightly:
    # Turns the unsigned DMG of a scheduled run into the rolling 'nightly' pre-release. The tag
    # and the release are recreated every night, so the download links stay stable while the
    # assets always point at the last built commit.
    needs: [preflight, build-unsigned]
    if: |
      needs.preflight.outputs.proceed == 'true' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true # the notes are the log since the previous nightly tag
    - uses: actions/download-artifact@v6
      with:
        name: nimble-commander-fork-unsigned
        path: dist
    - name: Publish the nightly pre-release
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ github.sha }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        dmg_files=(dist/*.dmg)
        if [ ${#dmg_files[@]} -eq 0 ]; then
          echo 'No DMG in the artifact' >&2
          exit 1
        fi
        dmg="${dmg_files[0]}"
        asset=nimble-commander-fork-nightly.dmg
        cp "$dmg" "$asset"
        sha256sum "$asset" > "$asset.sha256"

        notes=$(mktemp)
        {
          echo "Nightly build of `$REF_NAME` at commit [`$SHA`](https://github.com/$GITHUB_REPOSITORY/commit/$SHA) ($(date -u +%Y-%m-%d))."
          echo
          echo 'The application is unsigned and not notarised: drag it into /Applications and use'
          echo 'right-click -> Open on the first launch, or run'
          echo '`xattr -dr com.apple.quarantine "/Applications/Nimble Commander-Fork.app"`.'
          echo 'Requires macOS 12 Monterey or newer, Apple Silicon only.'
          echo
          echo '```'
          cat "$asset.sha256"
          echo '```'
          echo
          echo '## Changes since the previous nightly'
          if git rev-parse -q --verify refs/tags/nightly >/dev/null; then
            git log --no-merges --pretty='- %s (%h)' "nightly..$SHA" | head -60
          else
            echo '- first nightly build'
          fi
        } > "$notes"

        # Recreate the release so that the tag points at the built commit and the assets are
        # always the freshest ones.
        gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
        gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" >/dev/null 2>&1 || true
        gh release create nightly "$asset" "$asset.sha256" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$SHA" --prerelease --title 'Nightly build' --notes-file "$notes"

  build-unsigned:
    # Every remaining run is deliberate, so produce the unsigned DMG in all of them.
    needs: unit-tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
    - name: Select the Xcode version
      run: |
        if [ -d "/Applications/Xcode_${XC_VERSION}.app" ]; then
          sudo xcode-select -s "/Applications/Xcode_${XC_VERSION}.app"
        fi
        xcodebuild -version
    - name: Cache the Homebrew downloads
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-packaging-${{ hashFiles('.github/workflows/build.yml') }}
    - name: Install the dependencies
      run: brew install create-dmg pandoc basictex
    - uses: actions/checkout@v5
    - name: Install the test dependencies
      # 'gem install' has to happen before path_helper reshuffles the PATH - afterwards it resolves
      # to the un-writable system ruby.
      run: command -v xcpretty >/dev/null 2>&1 || gem install xcpretty
    - name: Build and package
      run: |
        eval "$(/usr/libexec/path_helper)"
        cd Scripts && ./build_unsigned.sh
    - uses: actions/upload-artifact@v6
      with:
        name: nimble-commander-fork-unsigned
        path: Scripts/*.dmg
        if-no-files-found: error
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: build-logs
        path: Scripts/**/*.log
        if-no-files-found: ignore
