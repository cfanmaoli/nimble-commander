name: Build and Test

on:
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - 'Docs/**'
      - 'Tools/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - 'Docs/**'
      - 'Tools/**'
      - '**/*.md'
  schedule:
    # Nightly, 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run every configuration, the full clang-tidy and the integration tests'
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch supersedes whatever is still running - the macOS runner pool is
# limited, and stale runs only make everyone wait longer.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XC_VERSION: '27.2'
  LLVM_VERSION: '23'

jobs:

  clang-format:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - name: Cache the Homebrew downloads
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-llvm${{ env.LLVM_VERSION }}-${{ hashFiles('.github/workflows/build.yml') }}
    - name: Install LLVM
      run: brew install llvm@${{ env.LLVM_VERSION }}
    - name: Run clang-format
      run: |
        export PATH="$(brew --prefix)/opt/llvm@${{ env.LLVM_VERSION }}/bin:$PATH"
        cd Scripts && ./run_clang_format.sh --check

  unit-tests:
    # Push: Debug only. Pull request: Debug and Release. Nightly / full dispatch: everything.
    needs: clang-format
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(((github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.full)) && '["Debug","Release","ASAN","UBSAN"]' || (github.event_name == 'pull_request') && '["Debug","Release"]' || '["Debug"]') }}
    steps:
    - name: Select the Xcode version
      run: |
        if [ -d "/Applications/Xcode_${XC_VERSION}.app" ]; then
          sudo xcode-select -s "/Applications/Xcode_${XC_VERSION}.app"
        fi
        xcodebuild -version
    - uses: actions/checkout@v5
    - name: Install the test dependencies
      run: gem install xcpretty
    - name: Decide whether clang-tidy runs
      id: tidy
      run: |
        if [ "${{ matrix.configuration }}" = "Debug" ] && { [ "${{ github.event_name }}" != "push" ] || [ "${{ inputs.full }}" = "true" ]; }; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Build and run the unit tests
      env:
        # Build the whole project and keep the compilation database when clang-tidy is about to
        # reuse it - that saves a complete second build of everything.
        EMIT_COMPILE_DB: ${{ steps.tidy.outputs.run == 'true' && '1' || '' }}
      run: "cd Scripts && ./run_all_unit_tests.sh ${{ matrix.configuration }}"
    - name: Cache the Homebrew downloads
      if: steps.tidy.outputs.run == 'true'
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-llvm${{ env.LLVM_VERSION }}-${{ hashFiles('.github/workflows/build.yml') }}-tidy
    - name: Install LLVM
      if: steps.tidy.outputs.run == 'true'
      run: brew install llvm@${{ env.LLVM_VERSION }}
    - name: Run clang-tidy
      if: steps.tidy.outputs.run == 'true'
      run: |
        export PATH="$(brew --prefix)/opt/llvm@${{ env.LLVM_VERSION }}/bin:$PATH"
        cd Scripts
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          ./run_clang_tidy.sh --check --use-db run_all_unit_tests.tmp
          exit 0
        fi
        # On pull requests only the touched translation units are analysed - unless a header
        # changed, in which case everything that includes it has to be looked at.
        git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
        git diff --name-only FETCH_HEAD HEAD -- Source > /tmp/tidy-changed-files.txt
        cat /tmp/tidy-changed-files.txt
        if grep -qE '\.(h|hpp)$' /tmp/tidy-changed-files.txt; then
          ./run_clang_tidy.sh --check --use-db run_all_unit_tests.tmp
        else
          ./run_clang_tidy.sh --check --use-db run_all_unit_tests.tmp --files /tmp/tidy-changed-files.txt
        fi
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-tests-logs-${{ matrix.configuration }}
        path: Scripts/**/*.log
        if-no-files-found: ignore

  integration-tests:
    # The docker/colima setup is the most fragile part of the pipeline, so it only runs nightly or
    # on an explicit full dispatch.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    needs: unit-tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
    - name: Select the Xcode version
      run: |
        if [ -d "/Applications/Xcode_${XC_VERSION}.app" ]; then
          sudo xcode-select -s "/Applications/Xcode_${XC_VERSION}.app"
        fi
        xcodebuild -version
    - name: Install the dependencies
      run: |
        find /usr/local/bin -lname '*/Library/Frameworks/Python.framework/*' -delete
        sudo rm -rf /Library/Frameworks/Python.framework/
        brew install qemu
        brew install docker
        brew install colima
        LIMACTL_PATH=$(brew --prefix)/bin/limactl
        sudo curl -L -o $LIMACTL_PATH https://github.com/mikekazakov/qemu-test/raw/main/limactl && sudo chmod +x $LIMACTL_PATH
        colima start --network-address --arch arm64 --vm-type=qemu
    - uses: actions/checkout@v5
    - name: Work around GHA issue 7522
      run: |
         # TODO: Replace this with a better solution. See https://github.com/actions/runner-images/issues/7522
         echo Killing XProtect...; sudo pkill -9 XProtect >/dev/null || true;
         echo Waiting for XProtect process...; while pgrep XProtect; do sleep 3; done;
    - name: Build and run integration tests
      run: |
        gem install xcpretty
        cd Scripts && ./run_all_integration_tests.sh

  build-unsigned:
    # The unsigned DMG is produced for pushes and the nightly only - pull requests don't need one.
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    needs: unit-tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
    - name: Select the Xcode version
      run: |
        if [ -d "/Applications/Xcode_${XC_VERSION}.app" ]; then
          sudo xcode-select -s "/Applications/Xcode_${XC_VERSION}.app"
        fi
        xcodebuild -version
    - name: Cache the Homebrew downloads
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-packaging-${{ hashFiles('.github/workflows/build.yml') }}
    - name: Install the dependencies
      run: brew install create-dmg pandoc basictex
    - uses: actions/checkout@v5
    - name: Build and package
      run: |
        eval "$(/usr/libexec/path_helper)"
        gem install xcpretty
        cd Scripts && ./build_unsigned.sh
    - uses: actions/upload-artifact@v4
      with:
        name: nimble-commander-fork-unsigned
        path: Scripts/*.dmg
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs
        path: Scripts/**/*.log
        if-no-files-found: ignore
